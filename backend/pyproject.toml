[project]
name = "bulatku-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel installs from this list (pyproject.toml wins over requirements.txt there).
# Keep in sync with the runtime packages in requirements.txt (checked by tests/test_deploy.py).
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.14.3",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.3.9",
    "PyJWT==2.10.1",
    "google-genai==3.5.0",
    "python-dotenv==1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
